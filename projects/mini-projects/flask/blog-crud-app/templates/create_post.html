{% extends "base.html" %}

{% block title %}New Post — Flask Blog{% endblock %}

{% block content %}
  <h1>Create Post</h1>

  <form action="{{ url_for('create_post') }}" method="POST" class="post-form">
    <label for="title">Title <span class="req">*</span></label>
    <!-- maxlength mirrors the 100-char back-end rule -->
    <input type="text" id="title" name="title" maxlength="100"
           value="{{ title or '' }}" required />

    <label for="author">Author <span class="req">*</span></label>
    <input type="text" id="author" name="author" value="{{ author or '' }}" required />

    <label for="content">Content <span class="req">*</span></label>
    <textarea id="content" name="content" rows="10" required>{{ content or '' }}</textarea>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Publish</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
{% endblock %}
