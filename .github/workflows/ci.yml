name: CI

on:
  push:
  pull_request:

# The KubeNotes project lives in a subdirectory of this repository.
defaults:
  run:
    working-directory: "Polito Course/final project/kubenotes"

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Polito Course/final project/kubenotes/requirements-dev.txt"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: isort (import order check)
        run: isort --check-only .

      - name: Pytest
        run: pytest -v

      - name: Bandit (SAST)
        run: bandit -r app

      - name: pip-audit (dependency audit)
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build -t kubeops:local .

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kubeops:local
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
