<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Pricing Row</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Choose a Plan</h1>

      <!-- Flex row of three cards that wrap on small screens -->
      <section class="pricing">
        <article class="plan">
          <h2>Basic</h2>
          <p class="price">€5<span>/mo</span></p>
          <ul>
            <li>3 projects</li>
            <li>5 GB storage</li>
            <li>Email support</li>
          </ul>
          <button>Choose Basic</button>
        </article>

        <article class="plan featured">
          <h2>Pro</h2>
          <p class="price">€12<span>/mo</span></p>
          <ul>
            <li>20 projects</li>
            <li>50 GB storage</li>
            <li>Chat support</li>
          </ul>
          <button>Choose Pro</button>
        </article>

        <article class="plan">
          <h2>Business</h2>
          <p class="price">€25<span>/mo</span></p>
          <ul>
            <li>Unlimited projects</li>
            <li>500 GB storage</li>
            <li>Priority support</li>
          </ul>
          <button>Choose Business</button>
        </article>
      </section>
    </main>
  </body>
</html>
