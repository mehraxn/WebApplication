<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>{% block title %}Flask Blog{% endblock %}</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ url_for('index') }}">✍ Flask Blog</a>
        <nav>
          <a href="{{ url_for('index') }}">Home</a>
          <a class="btn btn-primary btn-sm" href="{{ url_for('create_post') }}">+ New Post</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% for category, message in get_flashed_messages(with_categories=True) %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}

      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>Flask Blog CRUD App — built with Flask &amp; SQLite · &copy; 2026</small>
      </div>
    </footer>
  </body>
</html>
