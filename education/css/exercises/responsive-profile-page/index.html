    <link rel="stylesheet" href="style.css" />

          I build clean, responsive websites with HTML, CSS, and Flask. This page

        </p>

        <h2>Skills</h2>
        <ul>
          <li>HTML &amp; CSS</li>
          <li>Flexbox &amp; Grid</li>
          <li>Responsive design</li>

        </ul>
      </section>
    </main>

</html>
