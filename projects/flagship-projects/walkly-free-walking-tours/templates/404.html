{% extends "base.html" %}

{% block title %}Page not found | LA Walks{% endblock %}

{% block content %}
<section class="container py-5 error-page">
    <div class="card shadow-sm error-card">
        <div class="card-body text-center">
            <span class="error-code">404</span>
            <i class="bi bi-signpost-split error-icon" aria-hidden="true"></i>
            <h1 class="h3">Page not found</h1>
            <p class="text-muted">
                The page you are looking for does not exist or the link is no longer valid.
            </p>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Go to home</a>
        </div>
    </div>
</section>
{% endblock %}
