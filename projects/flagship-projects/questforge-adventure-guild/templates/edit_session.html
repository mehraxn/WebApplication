{% extends "base.html" %}

{% block title %}Edit Session | QuestForge{% endblock %}

{% block content %}
<nav class="mb-3" aria-label="Breadcrumb">
    <a class="link-secondary" href="{{ url_for('guild_master_dashboard') }}">Guild Master dashboard</a>
    <span class="text-muted mx-2" aria-hidden="true">/</span>
    <span>Edit session</span>
</nav>

<section class="management-form-panel">
    <span class="section-eyebrow">Schedule adjustment</span>
    <h1 class="h2">Edit {{ session.title }}</h1>
    <p class="text-muted">Only the day, start time, and location can be changed.</p>

    <form method="post">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label" for="day_of_week">Day</label>
                <select class="form-select" id="day_of_week" name="day_of_week" required>
                    {% for day in days %}
                        <option value="{{ day }}" {% if form_values.day_of_week == day %}selected{% endif %}>{{ day }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="start_time">Start time</label>
                <input class="form-control" id="start_time" name="start_time" type="time" value="{{ form_values.start_time }}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="location">Location</label>
                <select class="form-select" id="location" name="location" required>
                    {% for location in locations %}
                        <option value="{{ location }}" {% if form_values.location == location %}selected{% endif %}>{{ location }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
            <button class="btn quest-button" type="submit">Save session</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('guild_master_dashboard') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
