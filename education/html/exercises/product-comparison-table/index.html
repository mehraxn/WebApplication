<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Comparison Table</title>
  </head>
  <body>
    <header>
      <h1>Compare Our Plans</h1>
      <p>Three simple plans to choose from.</p>
    </header>

    <main>
      <table>
        <!-- A caption tells everyone what the table is about -->
        <caption>Subscription plan comparison</caption>

        <thead>
          <tr>
            <!-- scope tells assistive tech which direction a header applies to -->
            <th scope="col">Feature</th>
            <th scope="col">Basic</th>
            <th scope="col">Pro</th>
            <th scope="col">Business</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Price / month</th>
            <td>€5</td>
            <td>€12</td>
            <td>€25</td>
          </tr>
          <tr>
            <th scope="row">Projects</th>
            <td>3</td>
            <td>20</td>
            <td>Unlimited</td>
          </tr>
          <tr>
            <th scope="row">Storage</th>
            <td>5 GB</td>
            <td>50 GB</td>
            <td>500 GB</td>
          </tr>
          <tr>
            <th scope="row">Support</th>
            <td>Email</td>
            <td>Email + Chat</td>
            <td>24/7 Priority</td>
          </tr>
        </tbody>
      </table>
    </main>

    <footer>
      <p>&copy; 2026 Product Comparison Exercise</p>
    </footer>
  </body>
</html>
