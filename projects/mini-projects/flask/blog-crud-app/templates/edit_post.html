{% extends "base.html" %}

{% block title %}Edit Post — Flask Blog{% endblock %}

{% block content %}
  <h1>Edit Post</h1>

  <form action="{{ url_for('edit_post', post_id=post['id']) }}" method="POST" class="post-form">
    <label for="title">Title <span class="req">*</span></label>
    <input type="text" id="title" name="title" maxlength="100"
           value="{{ post['title'] }}" required />

    <label for="author">Author <span class="req">*</span></label>
    <input type="text" id="author" name="author" value="{{ post['author'] }}" required />

    <label for="content">Content <span class="req">*</span></label>
    <textarea id="content" name="content" rows="10" required>{{ post['content'] }}</textarea>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{{ url_for('post_detail', post_id=post['id']) }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
{% endblock %}
