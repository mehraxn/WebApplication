<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Navbar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Flexbox places the brand on the left and links on the right -->
    <header class="navbar">
      <div class="brand">DevSite</div>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Flexbox Navbar Demo</h1>
      <p>Resize the window to see the links wrap under the brand on small screens.</p>
    </main>
  </body>
</html>
