<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Box Model Demo</h1>
      <!-- This card shows width, padding, border, and margin working together -->
      <article class="card">
        <h2>Learning the Box Model</h2>
        <p>
          This card has a fixed width, inner padding, a border, and an outer
          margin. Thanks to box-sizing: border-box, the padding and border stay
          inside the width instead of making the card bigger.
        </p>
      </article>
    </main>
  </body>
</html>
