<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Template Loops</title>
  </head>
  <body>
    <h1>Fruit List</h1>

    {% if fruits %}
      <ul>
        <!-- Loop over the list passed from app.py -->
        {% for fruit in fruits %}
          <li>{{ fruit }}</li>
        {% endfor %}
      </ul>
      <p>Total fruits: {{ fruits|length }}</p>
    {% else %}
      <p>No fruits to show.</p>
    {% endif %}
  </body>
</html>
