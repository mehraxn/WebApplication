{% extends "base.html" %}

{% block title %}Edit Expense — Expense Tracker{% endblock %}

{% block content %}
  <h1>Edit Expense</h1>

  <form action="{{ url_for('edit_expense', expense_id=expense['id']) }}" method="POST" class="expense-form">
    <label for="title">Title <span class="req">*</span></label>
    <input type="text" id="title" name="title" value="{{ expense['title'] }}" required />

    <label for="amount">Amount (€) <span class="req">*</span></label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
           value="{{ '%.2f'|format(expense['amount']) }}" required />

    <label for="category">Category <span class="req">*</span></label>
    <select id="category" name="category" required>
      {% for cat in categories %}
        <option value="{{ cat }}" {{ 'selected' if expense['category'] == cat }}>{{ cat }}</option>
      {% endfor %}
    </select>

    <label for="date">Date <span class="req">*</span></label>
    <input type="date" id="date" name="date" value="{{ expense['date'] }}" required />

    <label for="note">Note</label>
    <textarea id="note" name="note" rows="3">{{ expense['note'] or '' }}</textarea>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
{% endblock %}
