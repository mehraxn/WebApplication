{% extends "base.html" %}

{% block title %}Something went wrong | LA Walks{% endblock %}

{% block content %}
<section class="container py-5 error-page">
    <div class="card shadow-sm error-card">
        <div class="card-body text-center">
            <span class="error-code">500</span>
            <i class="bi bi-cloud-lightning-rain error-icon" aria-hidden="true"></i>
            <h1 class="h3">Something went wrong</h1>
            <p class="text-muted">
                Something went wrong on our side. Please try again later.
            </p>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Go to home</a>
        </div>
    </div>
</section>
{% endblock %}
