{% extends "base.html" %}

{% block title %}Register | QuestForge{% endblock %}

{% block content %}
<div class="auth-panel auth-panel-wide">
    <div class="mb-4">
        <span class="auth-eyebrow">New guild member</span>
        <h1 class="h2 mt-2">Create an account</h1>
        <p class="text-muted mb-0">Register as an Adventurer or Guild Master.</p>
    </div>

    <form method="post" action="{{ url_for('register') }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="first_name">First name</label>
                <input class="form-control" id="first_name" name="first_name" type="text" value="{{ form_values.first_name }}" autocomplete="given-name" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="last_name">Last name</label>
                <input class="form-control" id="last_name" name="last_name" type="text" value="{{ form_values.last_name }}" autocomplete="family-name" required>
            </div>

            <div class="col-12">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" value="{{ form_values.email }}" autocomplete="email" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="confirm_password">Confirm password</label>
                <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
            </div>

            <div class="col-12">
                <label class="form-label" for="role">Account role</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="Adventurer" {% if form_values.role == 'Adventurer' %}selected{% endif %}>Adventurer</option>
                    <option value="GuildMaster" {% if form_values.role == 'GuildMaster' %}selected{% endif %}>Guild Master</option>
                </select>
                <div class="form-text">Admin accounts are created only by the Guild Council.</div>
            </div>
        </div>

        <button class="btn quest-button w-100 mt-4" type="submit">Create account</button>
    </form>

    <p class="text-center text-muted mt-4 mb-0">
        Already registered? <a href="{{ url_for('login') }}">Login here</a>.
    </p>
</div>
{% endblock %}
