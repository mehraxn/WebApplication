<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Transition Buttons</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Button Hover Effects</h1>
      <p>Hover over each button to see a different smooth transition.</p>

      <div class="buttons">
        <button class="btn btn-color">Color change</button>
        <button class="btn btn-grow">Grow</button>
        <button class="btn btn-lift">Lift + shadow</button>
        <button class="btn btn-outline">Fill outline</button>
      </div>
    </main>
  </body>
</html>
