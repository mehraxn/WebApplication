<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positioning Badge Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Product Card with Badge</h1>

      <!-- The card is the positioned parent; the badge is absolute inside it -->
      <article class="card">
        <span class="badge">-30%</span>
        <div class="image">Product Image</div>
        <div class="info">
          <h2>Wireless Headphones</h2>
          <p class="price">€69.99</p>
          <button>Add to cart</button>
        </div>
      </article>
    </main>
  </body>
</html>
