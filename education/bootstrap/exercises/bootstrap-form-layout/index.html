<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Form Layout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container my-5">
      <div class="row justify-content-center">
        <!-- Centered, medium-width form column -->
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="mb-4">Contact Us</h1>

          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Full name</label>
              <input type="text" id="name" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
            </div>

            <div class="mb-3">
              <label for="topic" class="form-label">Topic</label>
              <select id="topic" class="form-select">
                <option>Support</option>
                <option>Sales</option>
                <option>Feedback</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea id="message" class="form-control" rows="4"></textarea>
            </div>

            <div class="form-check mb-3">
              <input type="checkbox" id="subscribe" class="form-check-input" />
              <label for="subscribe" class="form-check-label">Subscribe to the newsletter</label>
            </div>

            <button type="submit" class="btn btn-primary">Send message</button>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
