<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Responsive Columns</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container my-5">
      <h1 class="mb-2">Responsive Columns</h1>
      <p class="text-muted mb-4">
        1 column on mobile, 2 on tablets, 3 on desktop. Resize the window to see it
        change.
      </p>

      <!--
        col-12    -> full width (1 per row) on phones
        col-md-6  -> half width (2 per row) from md up
        col-lg-4  -> one third (3 per row) from lg up
      -->
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-primary text-white text-center rounded">Column 1</div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-success text-white text-center rounded">Column 2</div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-danger text-white text-center rounded">Column 3</div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-warning text-dark text-center rounded">Column 4</div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-info text-dark text-center rounded">Column 5</div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-4 bg-secondary text-white text-center rounded">Column 6</div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
