{% extends "base.html" %}

{% block title %}New Task — Task Manager{% endblock %}

{% block content %}
  <h1>Create Task</h1>

  <form action="{{ url_for('create_task') }}" method="POST" class="task-form">
    <label for="title">Title <span class="req">*</span></label>
    <!-- value keeps the input if validation fails and the form re-renders -->
    <input type="text" id="title" name="title" value="{{ title or '' }}" required />

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4">{{ description or '' }}</textarea>

    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      <option value="Low" {{ 'selected' if priority == 'Low' }}>Low</option>
      <option value="Medium" {{ 'selected' if priority == 'Medium' or not priority }}>Medium</option>
      <option value="High" {{ 'selected' if priority == 'High' }}>High</option>
    </select>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create task</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
{% endblock %}
