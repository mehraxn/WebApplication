<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Contact Form</title>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <p>Fill in the form below and we'll get back to you.</p>
    </header>

    <main>
      <!-- method="POST" because we are sending data, not just reading -->
      <form action="/contact" method="POST">
        <!-- Each label is linked to its input with for + id -->
        <p>
          <label for="name">Full name</label><br />
          <input type="text" id="name" name="name" required />
        </p>

        <p>
          <label for="email">Email address</label><br />
          <input type="email" id="email" name="email" required />
        </p>

        <p>
          <label for="phone">Phone number</label><br />
          <input type="tel" id="phone" name="phone" />
        </p>

        <!-- Dropdown: value is sent to the server, text is shown to the user -->
        <p>
          <label for="topic">What is this about?</label><br />
          <select id="topic" name="topic">
            <option value="support">Support</option>
            <option value="sales">Sales</option>
            <option value="feedback">Feedback</option>
          </select>
        </p>

        <!-- Multi-line text box for a longer message -->
        <p>
          <label for="message">Your message</label><br />
          <textarea id="message" name="message" rows="5" required></textarea>
        </p>

        <!-- Checkbox: label wraps the input so clicking the text works too -->
        <p>
          <label>
            <input type="checkbox" name="subscribe" /> Subscribe to the newsletter
          </label>
        </p>

        <p>
          <button type="submit">Send message</button>
        </p>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Contact Form Exercise</p>
    </footer>
  </body>
</html>
